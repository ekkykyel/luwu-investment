<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .txt-bold { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; }
      .txt-black { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 900; }
      .txt-sub { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 700; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="240" rx="16" fill="#FFFFFF"/>

  <!-- ================= LOGO 1: NO KORUPSI ================= -->
  <g transform="translate(60, 20)">
    <!-- Letter N -->
    <text x="20" y="115" class="txt-black" font-size="90" fill="#111827">N</text>
    <!-- Red Handprint centered around O / Middle -->
    <g transform="translate(85, 30)">
      <!-- Palm Base -->
      <path d="M 35 70 C 25 60, 20 75, 22 90 C 24 105, 35 115, 55 115 C 75 115, 86 105, 88 90 C 90 75, 85 60, 75 70 C 65 80, 45 80, 35 70 Z" fill="#DC2626"/>
      <!-- Thumb -->
      <path d="M 24 75 C 10 65, 0 70, 5 85 C 10 95, 20 90, 26 80 Z" fill="#DC2626"/>
      <!-- Index Finger -->
      <path d="M 32 65 C 28 35, 38 20, 46 22 C 54 24, 48 45, 44 65 Z" fill="#DC2626"/>
      <!-- Middle Finger -->
      <path d="M 47 62 C 48 25, 58 10, 67 12 C 75 14, 68 38, 60 62 Z" fill="#DC2626"/>
      <!-- Ring Finger -->
      <path d="M 64 65 C 68 30, 79 18, 86 21 C 93 24, 84 45, 76 65 Z" fill="#DC2626"/>
      <!-- Pinky Finger -->
      <path d="M 78 72 C 86 48, 98 42, 103 47 C 107 52, 97 68, 87 78 Z" fill="#DC2626"/>
    </g>
    <!-- Text K RUPSI -->
    <text x="20" y="185" class="txt-black" font-size="44" fill="#111827" letter-spacing="2">K  RUP-SI</text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="330" y1="40" x2="330" y2="200" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="4 4" />

  <!-- ================= LOGO 2: STOP GRATIFIKASI ================= -->
  <g transform="translate(370, 30)">
    <!-- STOP Text with Hand -->
    <g>
      <text x="0" y="75" class="txt-black" font-size="78" fill="#EF4444" letter-spacing="-1">ST</text>
      <!-- Middle Hand Silhouette for O -->
      <g transform="translate(92, 12) scale(0.65)">
        <path d="M 28 65 C 20 55, 15 70, 17 85 C 19 100, 30 110, 50 110 C 70 110, 81 100, 83 85 C 85 70, 80 55, 70 65 Z" fill="#EF4444"/>
        <path d="M 19 70 C 5 60, -5 65, 0 80 C 5 90, 15 85, 21 75 Z" fill="#EF4444"/>
        <path d="M 27 60 C 23 30, 33 15, 41 17 C 49 19, 43 40, 39 60 Z" fill="#EF4444"/>
        <path d="M 42 57 C 43 20, 53 5, 62 7 C 70 9, 63 33, 55 57 Z" fill="#EF4444"/>
        <path d="M 59 60 C 63 25, 74 13, 81 16 C 88 19, 79 40, 71 60 Z" fill="#EF4444"/>
        <path d="M 73 67 C 81 43, 93 37, 98 42 C 102 47, 92 63, 82 73 Z" fill="#EF4444"/>
      </g>
      <text x="165" y="75" class="txt-black" font-size="78" fill="#EF4444" letter-spacing="-1">P</text>
    </g>

    <!-- GRATIFIKASI Text -->
    <text x="0" y="125" class="txt-black" font-size="34" fill="#111827" letter-spacing="2">GRATIFIKASI</text>

    <!-- Subtitle -->
    <text x="0" y="152" class="txt-sub" font-size="10.5" fill="#4B5563">Dilarang Menerima Dan Memberi Gratifikasi</text>
    <text x="0" y="167" class="txt-sub" font-size="10.5" fill="#4B5563">Dalam Bentuk Apapun</text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="660" y1="40" x2="660" y2="200" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="4 4" />

  <!-- ================= LOGO 3: STOP PUNGLI ================= -->
  <g transform="translate(710, 25)">
    <!-- Red Circle -->
    <circle cx="95" cy="95" r="88" fill="#E11D48" filter="url(#shadow)" />
    
    <!-- White Hand Silhouette -->
    <g transform="translate(48, 25) scale(0.95)">
      <!-- Palm Base -->
      <path d="M 35 65 C 25 55, 20 70, 22 85 C 24 98, 35 106, 50 106 C 65 106, 76 98, 78 85 C 80 70, 75 55, 65 65 Z" fill="#FFFFFF"/>
      <path d="M 20 70 C 8 60, -2 65, 3 80 C 8 90, 17 85, 22 75 Z" fill="#FFFFFF"/>
      <path d="M 28 60 C 24 30, 34 15, 42 17 C 50 19, 44 40, 40 60 Z" fill="#FFFFFF"/>
      <path d="M 43 57 C 44 20, 54 5, 63 7 C 71 9, 64 33, 56 57 Z" fill="#FFFFFF"/>
      <path d="M 60 60 C 64 25, 75 13, 82 16 C 89 19, 80 40, 72 60 Z" fill="#FFFFFF"/>
      <path d="M 74 67 C 82 43, 94 37, 99 42 C 103 47, 93 63, 83 73 Z" fill="#FFFFFF"/>
      <!-- STOP text in palm -->
      <text x="32" y="86" class="txt-black" font-size="14" fill="#111827">STOP</text>
    </g>

    <!-- PUNGLI Text -->
    <text x="95" y="152" class="txt-black" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">PUNGLI</text>
  </g>

  <!-- Vertical Divider 3 -->
  <line x1="940" y1="40" x2="940" y2="200" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="4 4" />

  <!-- ================= LOGO 4: BERANI JUJUR HEBAT! ================= -->
  <g transform="translate(980, 25)">
    <!-- Red Circle -->
    <circle cx="95" cy="95" r="88" fill="#DC2626" filter="url(#shadow)" />
    
    <!-- Dynamic Brush Style Text -->
    <g transform="translate(95, 95) rotate(-6)">
      <text x="0" y="-22" class="txt-black" font-size="28" fill="#FFFFFF" text-anchor="middle" font-style="italic" letter-spacing="1">BERANI</text>
      <text x="0" y="10" class="txt-black" font-size="34" fill="#FFFFFF" text-anchor="middle" font-style="italic" letter-spacing="0.5">JUJUR</text>
      <text x="0" y="42" class="txt-black" font-size="26" fill="#FFFFFF" text-anchor="middle" font-style="italic" letter-spacing="1.5">HEBAT!</text>
    </g>
  </g>
</svg>
