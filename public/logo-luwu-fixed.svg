<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2009/svg" viewBox="0 0 200 230" width="200" height="230">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Shield Frame -->
  <path d="M 20,20 Q 20,10 30,10 L 170,10 Q 180,10 180,20 L 180,130 C 180,185 100,220 100,220 C 100,220 20,185 20,130 Z" 
        fill="url(#shieldGrad)" stroke="#facc15" stroke-width="4" filter="url(#shadow)"/>

  <!-- Inner Gold Border Line -->
  <path d="M 26,24 L 174,24 L 174,128 C 174,178 100,210 100,210 C 100,210 26,178 26,128 Z" 
        fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.8"/>

  <!-- Top Golden Star -->
  <polygon points="100,18 104,30 116,30 106,37 110,49 100,41 90,49 94,37 84,30 96,30" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="0.5"/>

  <!-- Upper White Banner Ribbon -->
  <path d="M 45,52 Q 100,42 155,52 L 150,62 Q 100,52 50,62 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Text LUWU inside emblem -->
  <path d="M 50,85 Q 100,70 150,85" id="textPathLuwu" fill="none"/>
  <text font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    <textPath xlink:href="#textPathLuwu" startOffset="50%">LUWU</textPath>
  </text>

  <!-- Left Golden Wing -->
  <g fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="0.8">
    <path d="M 92,100 C 70,85 40,75 30,100 C 25,115 32,135 45,150 C 55,160 70,165 92,160 C 80,145 75,125 92,100 Z"/>
    <!-- Wing Feathers -->
    <path d="M 32,105 C 45,95 70,95 88,110" fill="none" stroke="#b45309" stroke-width="1"/>
    <path d="M 36,120 C 50,110 72,112 88,125" fill="none" stroke="#b45309" stroke-width="1"/>
    <path d="M 42,138 C 55,128 75,130 88,140" fill="none" stroke="#b45309" stroke-width="1"/>
  </g>

  <!-- Right Golden Wing -->
  <g fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="0.8">
    <path d="M 108,100 C 130,85 160,75 170,100 C 175,115 168,135 155,150 C 145,160 130,165 108,160 C 120,145 125,125 108,100 Z"/>
    <!-- Wing Feathers -->
    <path d="M 168,105 C 155,95 130,95 112,110" fill="none" stroke="#b45309" stroke-width="1"/>
    <path d="M 164,120 C 150,110 128,112 112,125" fill="none" stroke="#b45309" stroke-width="1"/>
    <path d="M 158,138 C 145,128 125,130 112,140" fill="none" stroke="#b45309" stroke-width="1"/>
  </g>

  <!-- Center Keris / Badik Luwu -->
  <!-- Blade (Red wavy dagger) -->
  <path d="M 100,50 Q 104,70 98,90 Q 103,110 97,130 Q 102,145 100,152 Q 98,145 103,130 Q 97,110 102,90 Q 96,70 100,50 Z" 
        fill="#dc2626" stroke="#991b1b" stroke-width="1.2"/>
  <!-- Hilt / Handle (Pangkal Badik/Keris) -->
  <path d="M 100,152 C 94,154 90,160 92,168 C 94,174 100,175 102,170 C 104,166 102,158 100,152 Z" 
        fill="#1e293b" stroke="#0f172a" stroke-width="1"/>

  <!-- Bottom Chain / Beads (Rantai) -->
  <path d="M 45,172 Q 100,195 155,172" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="3 3"/>
  <path d="M 45,172 Q 100,195 155,172" fill="none" stroke="#94a3b8" stroke-width="1"/>
</svg>
